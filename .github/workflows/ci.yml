name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match flake.nix's rustToolchain (the adapter's).
  RUST_VERSION: "1.98.1"
  # Must match flake.nix's solanaVersion.
  SOLANA_VERSION: "4.3.0"
  # Must match Cargo.toml's anchor-lang and flake.nix's anchorCli.
  ANCHOR_VERSION: "1.2.2"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Check formatting
        run: ./scripts/ops.sh fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/integration-test

      - name: Run clippy
        run: ./scripts/ops.sh clippy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: ./scripts/ops.sh unit-test

  rust-package:
    name: Rust package (crates.io dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # Packages the client crate as crates.io would take it and builds it
      # from the packaged files alone: a git dependency, or a file the build
      # reads that the package lacks, fails here rather than at release.
      - name: cargo publish --dry-run -p anomapay-spl-token-forwarder-client
        run: cargo publish --dry-run -p anomapay-spl-token-forwarder-client

  anchor-build:
    name: Anchor Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/integration-test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          curl -fsSL -o anchor "https://github.com/otter-sec/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu"
          chmod +x anchor
          sudo mv anchor /usr/local/bin/

      # The scripts' builds generate only the IDL and types: a deploy artifact
      # already in target/deploy (verify-build's, which a --prebuilt deploy
      # ships) must survive them.
      - name: Plant a deploy artifact
        run: |
          mkdir -p target/deploy
          head -c 4096 /dev/urandom > target/deploy/spl_token_forwarder.so
          sha256sum target/deploy/spl_token_forwarder.so > "$RUNNER_TEMP/deploy-artifact.sha256"

      - name: The production IDL check and the operator scripts' type check
        run: ./scripts/ops.sh typecheck

      - name: The operator scripts against a local runtime
        run: ./scripts/ops.sh script-test

      - name: The deploy artifact is untouched
        run: sha256sum -c "$RUNNER_TEMP/deploy-artifact.sha256"

  ts:
    name: TypeScript bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Type-check and test the TypeScript bindings
        run: ./scripts/ops.sh ts-test

  # The forwarder's tests on the adapter's harness, locally. Their e2e cases
  # need devnet and the proving queue (dev.sh integration-test --e2e).
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/integration-test

      - name: Run the integration tests
        run: ./scripts/ops.sh integration-test

  # The forwarder build the integration tests load must be the deterministic
  # build of this commit.
  test-program:
    name: Test Program
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # Caches ~/.cargo/bin, so solana-verify is built once per version.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.2 --locked

      - name: Check the committed test program is the deterministic build
        run: ./scripts/ops.sh test-program --check

