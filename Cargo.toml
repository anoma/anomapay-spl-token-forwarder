[workspace]
members = ["programs/*", "crates/client", "crates/program-tests"]
resolver = "2"

# solana-verify picks its deterministic build image from this version. Keep in
# lockstep with flake.nix's solanaVersion and CI, and with the adapter's.
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.dependencies]
# The adapter's Anchor release.
anchor-lang = "1.2.2"
# The adapter this forwarder is built against: its program crate (the state
# layout, the upgrade helpers, the event discriminators), and its client (the
# adapter's PDAs, the forwarder registry the submitter plugs into, the
# deployment record's environments and parser) at the release the integration
# tests' harness pins, so this client and the harness share one copy of it.
protocol-adapter = { git = "https://github.com/anoma/solana-protocol-adapter", tag = "contracts/v2.0.0-rc.12", default-features = false, features = ["no-entrypoint"] }
anoma-pa-solana-client = { version = "0.12.1", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
