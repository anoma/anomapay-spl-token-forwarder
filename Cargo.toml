[workspace]
members = ["programs/*", "crates/client"]
resolver = "2"

# solana-verify picks its deterministic build image from this version. Keep in
# lockstep with flake.nix's solanaVersion and CI, and with the adapter's.
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.dependencies]
# The adapter's pin: an Anchor commit with solana-foundation/anchor#4737, which
# lets a program with a field-less accounts struct compile with `cpi`. No
# published Anchor has the fix (1.2.1 does not).
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "2c9747a2d31bd5e94745cee6c083577f3e6675c0" }
# The adapter this forwarder is built against: its program crate (the state
# layout, the upgrade helpers, the event discriminators), and its client at
# the commit the integration tests' harness pins, so the tests link one copy
# of the client.
protocol-adapter = { git = "https://github.com/anoma/solana-protocol-adapter", rev = "1e312438352307e8f4468ad4fa90d447798187ea", default-features = false, features = ["no-entrypoint"] }
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "7ed4f3ee29ec4f8840fd20599e28f2e50a79fb37", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
