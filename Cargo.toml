[workspace]
members = ["programs/*", "crates/client"]
resolver = "2"

# solana-verify picks its deterministic build image from this version. Keep in
# lockstep with flake.nix's solanaVersion and CI, and with the adapter's.
[workspace.metadata.cli]
solana = "4.3.0"

[workspace.dependencies]
# The adapter's pin: Anchor's v1.2.1 release PR (solana-foundation/anchor#5134),
# whose fix #4737 lets a program with a field-less accounts struct compile with
# `cpi`. Moves with the adapter to the published 1.2.1
# (anoma/solana-protocol-adapter#124).
anchor-lang = { git = "https://github.com/otter-sec/anchor", rev = "2c9747a2d31bd5e94745cee6c083577f3e6675c0" }
# The adapter this forwarder is built against: its program crate (the state
# layout, the upgrade helpers) and its client: the revision of the adapter's
# integration-test harness and the client the harness pins, so the tests link
# one copy of the client.
protocol-adapter = { git = "https://github.com/anoma/solana-protocol-adapter", rev = "aa16244c844ea943e2e199ccedae46619b7177d7", default-features = false, features = ["no-entrypoint"] }
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", rev = "6b2f41cf613ccaf593bee79bc138c71dd1f7ab4c", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
