[package]
name = "anomapay-spl-token-forwarder-client"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Client bindings for the AnomaPay SPL token forwarder: instruction builders, CPI segments, wire formats, events"
repository = "https://github.com/anoma/anomapay-spl-token-forwarder"

[dependencies]
# The adapter's client: the adapter's PDAs the instructions and segments
# take, and the forwarder registry the submitter plugs into.
anoma-pa-solana-client = { workspace = true }
# The generated bindings (`declare_program!` over `idls/`), and the Borsh
# encoding of the wire formats.
anchor-lang = { workspace = true }
# Pure deps: the wire formats compile for any target.
base64 = "0.22"
sha2 = "0.10"

# Solana SDK deps, used only by the instruction, segment and PDA builders;
# the versions the programs build with (Anchor 1.2).
solana-compute-budget-interface = { version = "3", optional = true }
solana-ed25519-program = { version = "3", optional = true }
solana-instruction = { version = "3", optional = true }
solana-pubkey = { version = "3", optional = true }
solana-sdk-ids = { version = "3", optional = true }
spl-associated-token-account-interface = { version = "2", optional = true }
spl-token-interface = { version = "3", optional = true }

# The deployment record (`solana` feature): `deployments.json`.
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# The submitter's plug-in and the instances (`rpc` feature): the adapter
# client's `Forwarder` for this program, and the program's state read and
# its `version` simulated over an RPC.
solana-message = { version = "4", optional = true }
solana-rpc-client = { version = "4", optional = true }
solana-rpc-client-api = { version = "4", optional = true }
solana-signature = { version = "3", optional = true }
solana-transaction = { version = "4", optional = true }
solana-transaction-error = { version = "3", optional = true }

[build-dependencies]
# Reads the IDL's account layouts for `build.rs`.
serde_json = "1.0"

[dev-dependencies]
# Reads the vendored IDLs and the deployment record.
serde_json = "1.0"
# The clusters the record's chain ids name.
solana-cluster-type = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "deployments"
required-features = ["solana"]

[[test]]
name = "deployed"
required-features = ["rpc"]

[features]
default = ["solana"]
# The instruction builders, CPI segments, PDA derivation and the deployment
# record.
solana = [
  "anoma-pa-solana-client/solana",
  "dep:serde",
  "dep:serde_json",
  "dep:solana-compute-budget-interface",
  "dep:solana-ed25519-program",
  "dep:solana-instruction",
  "dep:solana-pubkey",
  "dep:solana-sdk-ids",
  "dep:spl-associated-token-account-interface",
  "dep:spl-token-interface",
]
# The submitter's plug-in (`submitter::SplTokenForwarderCalls`, the adapter
# client's `Forwarder` for this program) and the instances of both builds
# (`instance`).
rpc = [
  "solana",
  "anoma-pa-solana-client/rpc",
  "dep:solana-message",
  "dep:solana-rpc-client",
  "dep:solana-rpc-client-api",
  "dep:solana-signature",
  "dep:solana-transaction",
  "dep:solana-transaction-error",
]

# The cfgs `declare_program!`'s output tests: the Solana target, and the
# `idl-build` feature of a program crate, which this crate is not.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("idl-build"))'] }
