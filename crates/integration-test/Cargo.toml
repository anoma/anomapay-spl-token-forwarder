[package]
name = "anomapay-spl-token-forwarder-integration-test"
description = "Integration and e2e tests of the AnomaPay SPL token forwarder on the Solana protocol adapter's harness."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anoma/anomapay-spl-token-forwarder"
publish = false

# Its own workspace, as the adapter's harness is: surfpool-sdk pins Solana
# crates that would lower the versions the program builds against if it
# shared the program's lockfile.
[workspace]

[features]
default = ["local"]
# The operator scripts' tests (tests/operator_scripts.rs), which need the
# scripts' dependencies and the production build's types: ops.sh script-test.
scripts = []
local = ["anoma-pa-solana-integration-test/local"]
e2e = ["anoma-pa-solana-integration-test/e2e"]

[dependencies]
# The adapter's harness: pa-testkit's environments for the Solana adapter.
anoma-pa-solana-integration-test = { git = "https://github.com/anoma/solana-protocol-adapter", tag = "bindings/v0.3.0", default-features = false }
# The client and pa-testkit the harness pins.
anoma-pa-solana-client = { git = "https://github.com/anoma/anoma-pa-solana-client", tag = "bindings/v0.7.0" }
anoma-pa-testkit = { git = "https://github.com/anoma/pa-testkit", rev = "88974462f5ab996c350eeca16639457120cf7dd5", default-features = false, features = [
  "fixtures",
] }
anomapay-spl-token-forwarder-client = { path = "../client", features = ["rpc"] }
anoma-rm-risc0 = { version = "=2.0.0-rc.7", default-features = false, features = ["transaction"] }
anoma-rm-risc0-gadgets = "=2.0.0-rc.7"
# The AnomaPay transfer resource whose logic ref (25ff6c33) the forwarder
# serves, and its emergency-migrating logic (66dc8661), which the
# emergency-migrating build moves to: another build has another logic ref,
# which a forwarder configured for this one refuses.
emergency_migrating_transfer_library = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "1cfe98b1836f57a4062419dccf08806a4ddfc6e9" }
emergency_migrating_transfer_witness = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "1cfe98b1836f57a4062419dccf08806a4ddfc6e9" }
transfer_library = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "1cfe98b1836f57a4062419dccf08806a4ddfc6e9" }
transfer_witness = { git = "https://github.com/anoma/anomapay-solana-resource", rev = "1cfe98b1836f57a4062419dccf08806a4ddfc6e9" }
anyhow = "1.0"
bincode = "1.3"
k256 = "0.13"
rand_chacha = "0.3"
risc0-zkvm = { version = "3.0.3", default-features = false }
solana-ed25519-program = "3"
solana-instruction = "3"
solana-keypair = "3.1"
solana-loader-v3-interface = { version = "7", features = ["serde"] }
solana-program-pack = "3"
solana-rpc-client = "4"
solana-rpc-client-types = "4"
solana-signer = "3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
spl-associated-token-account-interface = "2"
spl-token-interface = "3"
surfpool-sdk = "=1.6.0"

[dev-dependencies]
base64 = "0.22"
serde_json = "1.0"
solana-sdk-ids = "3"
solana-signature = "3"
solana-transaction = "4"
solana-message = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "operator_scripts"
required-features = ["scripts"]
