[package]
name = "spl-token-forwarder"
version = "2.0.0-rc.10"
description = "SPL Token forwarder for wrap/unwrap operations with Ed25519 signature verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spl_token_forwarder"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "protocol-adapter/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Development builds only: dev_set_config_version, for testing reinitialize.
dev-config-version = []
# The emergency-migrating build, the port of the EVM draft
# EmergencyMigratingERC20Forwarder: an owner upgrades the forwarder to it
# after a flaw in a circuit version of the transfer resource (docs/EMERGENCY_MIGRATION.md).
emergency-migrating = ["dep:arm-core"]

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
solana-instructions-sysvar = "5.0"
solana-sdk-ids = "3.1"
solana-sha256-hasher = "3.1"
# Standard base64 of the signed message hash. 0.21 is the version anchor-lang
# 1.2.0 requires, so the on-chain graph has one base64.
base64 = "0.21.7"
# The adapter's state account type, so the closing instructions' paused check
# reads the flag through the adapter's own layout instead of byte offsets, and
# the upgrade helpers the adapter shares with its forwarders.
protocol-adapter = { workspace = true }
# The digest type of the adapter's historical-root check, which an emergency
# migration runs on each resource's root; the adapter's version.
arm-core = { package = "anoma-rm-core", version = "2.0.0-rc.8.1", optional = true }

[dev-dependencies]
hex-literal = "1.1"
# Parsing the committed IDLs in the event signature and arg seed tests
serde_json = "1.0"

[[test]]
name = "event_signature"
required-features = ["idl-build"]

[[test]]
name = "idl_seeds"
required-features = ["idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
